name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: python3 scripts/preview.py --build-only
      - run: node --check .build/preview/bootstrap.js
