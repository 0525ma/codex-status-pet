<!doctype html><html><meta charset="utf-8"><title>Status Pet侧栏组件验证 · 独立预览</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#26303b}nav{position:fixed;inset:0 auto 0 0;width:76px;background:#f0f1f3;border-right:1px solid #e3e5e8;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:12px}.spacer{flex:1}nav footer{height:52px;width:60px;text-align:center;padding-top:16px}main{margin-left:76px;padding:46px;max-width:1000px}h1{font-size:23px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{font:inherit;padding:8px 13px;border:1px solid #d9dfe8;border-radius:10px;background:white;cursor:pointer}.note{font-size:13px;color:#828b99}code{font-size:12px}#result{margin-top:20px;white-space:pre-wrap;font-size:12px}</style><body><nav data-app-navigation-rail><div>◉</div><div class="spacer"></div><footer>设置</footer></nav><main><h1>Status Pet · 侧栏额度机器人</h1><p>左侧为与安装扩展共用的真实组件代码。</p><p class="note">本页是独立验证环境，示例数据会明确标记，不是Codex主窗口截图。</p><div class="controls" id="controls"></div><p>单击左侧机器人互动；双击展开可拖动虚拟宠物。百分比与周额度继续保留。</p><div id="result"></div></main><script src="bootstrap.js"></script><script>
const states={idle:'休息',thinking:'思考',searching:'搜索',working:'工作',listening:'等待输入',happy:'完成',alerting:'失败提示',writing:'书写',orbit:'多Agent协作',humming:'等待工具'};let remaining=37;
function sample(s){window.__codexUsageBadge.update({percent:remaining,title:'示例数据：周额度剩余 '+remaining+'%',tone:remaining<=5?'danger':'warning',windowLabel:'周',mode:'single',updatedAt:Date.now(),stale:false});window.__statusQuotaPet.updateWork({connection:'local-events',checkedAt:Date.now()/1000,threads:[{id:'preview',title:'组件验证示例',state:s,label:states[s],eventAt:Date.now()/1000}]});document.getElementById('result').textContent=JSON.stringify(window.__statusQuotaPet.status(),null,2)}
for(const[s,label]of Object.entries(states)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>sample(s);document.getElementById('controls').append(b)}const low=document.createElement('button');low.textContent='低额度5%';low.onclick=()=>{remaining=5;sample('idle')};document.getElementById('controls').append(low);sample('idle');
</script></body></html>
